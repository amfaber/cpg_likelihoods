name: Build downloadable binaries

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: cpg-likelihoods
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: cpg-likelihoods
          - os: macos-15
            target: aarch64-apple-darwin
            binary: cpg-likelihoods
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: cpg-likelihoods.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target "${{ matrix.target }}"
      - name: Check version tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(cargo +stable metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$version" ]]; then
            echo "Tag $REF_NAME must match Cargo.toml version v$version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Test
        run: cargo +stable test --locked --all-targets --target "${{ matrix.target }}"
      - name: Build release binary
        run: cargo +stable build --locked --release --bin cpg-likelihoods --target "${{ matrix.target }}"
      - name: Smoke test
        run: target/${{ matrix.target }}/release/${{ matrix.binary }} --version
      - name: Package binary and README
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          mkdir dist
          cp "target/$TARGET/release/$BINARY" README.md dist/
          tar -czf "cpg-likelihoods-$VERSION-$TARGET.tar.gz" -C dist .
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: cpg-likelihoods-${{ env.VERSION }}-${{ matrix.target }}
          path: cpg-likelihoods-*.tar.gz
          if-no-files-found: error
          retention-days: 30
